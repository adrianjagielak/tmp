<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PDF Viewer with Page Navigation</title>
  <style>
    iframe {
      width: 80%;
      height: 600px;
      border: 1px solid #ccc;
      display: block;
      margin: 20px auto;
    }
    .controls {
      text-align: center;
      margin: 20px;
    }
    button {
      font-size: 16px;
      padding: 10px 20px;
      margin: 0 10px;
    }
  </style>
</head>
<body>

  <iframe id="pdfFrame" src="https://mozilla.github.io/pdf.js/web/viewer.html?file=https://ontheline.trincoll.edu/images/bookdown/sample-local-pdf.pdf"></iframe>
</body>
</html>
