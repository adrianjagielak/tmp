<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PDF Viewer with Page Navigation</title>
  <style>
    iframe {
      width: 80%;
      height: 600px;
      border: 1px solid #ccc;
      display: block;
      margin: 20px auto;
    }
    .controls {
      text-align: center;
      margin: 20px;
    }
    button {
      font-size: 16px;
      padding: 10px 20px;
      margin: 0 10px;
    }
    #urlDisplay {
      text-align: center;
      font-family: monospace;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <iframe id="pdfFrame" src="file:///Users/adrianjagielak/Downloads/multipage.pdf#page=1"></iframe>

  <div class="controls">
    <button id="prevPage">Previous Page</button>
    <button id="nextPage">Next Page</button>
    <div id="urlDisplay"></div>
  </div>

  <script>
    let currentPage = 1;
    const pdfUrl = 'multipage.pdf';
    const pdfFrame = document.getElementById('pdfFrame');
    const prevButton = document.getElementById('prevPage');
    const nextButton = document.getElementById('nextPage');
    const urlDisplay = document.getElementById('urlDisplay');

    function updateIframe() {
      const newUrl = `${pdfUrl}#page=${currentPage}`;
      pdfFrame.src = newUrl;
      urlDisplay.textContent = newUrl;



pdfFrame.contentWindow.location.reload(true);
    }

    prevButton.onclick = function() {
      if (currentPage > 1) {
        currentPage--;
        updateIframe();
      }
    };

    nextButton.onclick = function() {
      currentPage++;
      updateIframe();
    };

    // Initialize URL display
    urlDisplay.textContent = `${pdfUrl}#page=${currentPage}`;
  </script>

</body>
</html>
