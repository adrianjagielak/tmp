<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <title>PDF.js Legacy Demo</title>
  <style>
    #pdfViewer {
      border: 1px solid #ccc;
      margin: 20px auto;
      display: block;
    }
    .controls {
      text-align: center;
      margin: 20px;
    }
    button {
      font-size: 16px;
      padding: 10px 20px;
      margin: 0 10px;
    }
    .status {
      text-align: center;
      font-family: monospace;
    }
  </style>
</head>
<body>

  <canvas id="pdfViewer"></canvas>

  <div class="controls">
    <button id="prevPage">Previous Page</button>
    <button id="nextPage">Next Page</button>
  </div>

  <div class="status">
    Page: <span id="currentPage">1</span> /
    <span id="totalPages">?</span>
  </div>

  <!-- PDF.js legacy build -->
  <script src="https://github.com/mozilla/pdfjs-dist/raw/refs/heads/master/legacy/build/pdf.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 
      'https://github.com/mozilla/pdfjs-dist/raw/refs/heads/master/legacy/build/pdf.worker.js';

    const url = 'multipage.pdf';

    let pdfDoc = null,
        pageNum = 1,
        pageRendering = false,
        pageNumPending = null,
        scale = 1.5,
        canvas = document.getElementById('pdfViewer'),
        ctx = canvas.getContext('2d');

    function renderPage(num) {
      pageRendering = true;
      pdfDoc.getPage(num).then(function(page) {
        const viewport = page.getViewport({ scale: scale });
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        const renderContext = {
          canvasContext: ctx,
          viewport: viewport
        };
        const renderTask = page.render(renderContext);

        renderTask.promise.then(function() {
          pageRendering = false;

          document.getElementById('currentPage').textContent = pageNum;

          if (pageNumPending !== null) {
            renderPage(pageNumPending);
            pageNumPending = null;
          }
        });
      });
    }

    function queueRenderPage(num) {
      if (pageRendering) {
        pageNumPending = num;
      } else {
        renderPage(num);
      }
    }

    document.getElementById('prevPage').addEventListener('click', function() {
      if (pageNum <= 1) {
        return;
      }
      pageNum--;
      queueRenderPage(pageNum);
    });

    document.getElementById('nextPage').addEventListener('click', function() {
      if (pageNum >= pdfDoc.numPages) {
        return;
      }
      pageNum++;
      queueRenderPage(pageNum);
    });

    pdfjsLib.getDocument(url).promise.then(function(pdfDoc_) {
      pdfDoc = pdfDoc_;
      document.getElementById('totalPages').textContent = pdfDoc.numPages;

      renderPage(pageNum);
    }).catch(function(error) {
      console.error('Błąd ładowania PDF:', error);
    });
  </script>

</body>
</html>
